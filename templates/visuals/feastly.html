{# Feastly — stylised phone: mood chips, results, chatbot #}
<div class="vf">
  <div class="v-glow"></div>
  <div class="phone">
    <div class="phone-screen">
      <span class="phone-island"></span>
      <div class="vf-top">
        <span class="vf-hello">Good evening</span>
        <span class="vf-q">What's the mood tonight?</span>
      </div>
      <div class="vf-chips">
        <span style="--i:0">Cozy</span><span style="--i:1">Date night</span><span style="--i:2">Quick bite</span><span style="--i:3">With friends</span><span style="--i:4">Adventurous</span><span style="--i:5">Outdoor</span>
      </div>
      <div class="vf-list">
        {% for n in range(3) %}
        <div class="vf-item" style="--i:{{ n }}">
          <span class="vf-thumb"></span>
          <span class="vf-lines"><i></i><i></i></span>
          <span class="vf-pin"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></span>
        </div>
        {% endfor %}
      </div>
      <div class="vf-chat">
        <span class="vf-bubble">Somewhere quiet, close by?</span>
        <span class="vf-bubble vf-bubble--bot"><i></i><i></i><i></i></span>
      </div>
    </div>
  </div>
</div>
