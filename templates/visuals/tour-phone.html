{# Phone playing the project's real screen recordings; videos load lazily (see main.js). #}
<div class="proj-visual">
  <div class="v-glow" aria-hidden="true"></div>
  <div class="phone" aria-hidden="true" inert>
    <div class="phone-screen">
      {% for c in p.tour %}
      <video class="tour-video{% if loop.first %} is-active{% endif %}" muted playsinline disablepictureinpicture preload="none" tabindex="-1"
             data-src="/static/media/{{ p.id }}/{{ c.id }}" data-v="{{ media_v }}" data-poster="/static/media/{{ p.id }}/{{ c.id }}-poster.webp?v={{ media_v }}"></video>
      {% endfor %}
      <noscript><img class="tour-video is-active" src="/static/media/{{ p.id }}/{{ p.tour[0].id }}-poster.webp?v={{ media_v }}" alt=""/></noscript>
    </div>
  </div>
  <button class="tour-toggle" type="button" aria-label="Pause the {{ p.name }} demo">
    <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/></svg>
    <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
  </button>
</div>
